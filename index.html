<style>
  html, body { margin: 0; padding: 0; background: #F6F4EF; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; font-family: -apple-system, Inter, sans-serif; }
  * { -webkit-user-select: none; user-select: none; }
  input, select, textarea { -webkit-user-select: text; user-select: text; }
  body { -webkit-touch-callout: none; }
  #boot-status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; padding: 24px; text-align: center; background: #F6F4EF; z-index: 999; }
  #boot-status.hidden { display: none; }
  #boot-status .spinner { width: 28px; height: 28px; border: 3px solid #E4DFD5; border-top-color: #B9541F; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot-status .err { color: #B23A24; font-size: 12px; white-space: pre-wrap; text-align: left; background: #fff; border: 1px solid #E4DFD5; border-radius: 8px; padding: 12px; max-width: 100%; overflow: auto; font-family: monospace; }
  #boot-status .msg { font-size: 14px; color: #201B17; }
  #boot-status button { padding: 9px 16px; border-radius: 8px; border: 1px solid #E4DFD5; background: #fff; font-size: 13px; font-weight: 600; margin-top: 4px; cursor: pointer; }
</style>
</head>
<body>
<div id="boot-status">
  <div class="spinner"></div>
  <div class="msg">Loading Foodcravia&hellip;</div>
</div>
<div id="root"></div>

<script>
function showBootError(msg) {
  var el = document.getElementById("boot-status");
  if (!el) return;
  el.classList.remove("hidden");
  el.innerHTML = '<div class="msg" style="color:#B23A24;font-weight:600;">Something went wrong loading the app</div>' +
    '<div class="err"></div>' +
    '<div class="msg" style="font-size:12px;color:#79726A;">If this is the first time opening the file, it usually means the page could not reach the internet to load React. Connect to wifi or data and reopen the file.</div>';
  el.querySelector(".err").textContent = String(msg);
}
function hideBoot() {
  var el = document.getElementById("boot-status");
  if (el) el.classList.add("hidden");

        s.onload = () => { s.setAttribute("data-loaded", "true"); resolve(); };
